<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Google Sans', Roboto, Arial, sans-serif; margin: 0; padding: 16px; color: #202124; font-size: 13px; }
      .wrap { max-width: 640px; margin: 0 auto; }
      h3 { margin: 0 0 4px; font-size: 15px; }
      .hint { color: #5f6368; font-size: 11.5px; margin: 2px 0 0; }
      select, button, input, textarea { font: inherit; }
      select, input[type=text], input[type=number], textarea {
        width: 100%; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; box-sizing: border-box;
      }
      textarea { resize: vertical; }
      .section { margin-bottom: 16px; }
      label.block { display: block; font-weight: 500; margin-bottom: 4px; }
      .aud { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #dadce0; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
      .aud input { margin: 0; }
      .aud .desc { color: #5f6368; font-size: 11px; }
      .aud .count { margin-left: auto; background: #e8f0fe; color: #1967d2; border-radius: 10px; padding: 1px 8px; font-size: 11px; white-space: nowrap; }
      .aud .count.zero { background: #f1f3f4; color: #5f6368; }
      .aud.disabled { opacity: 0.55; cursor: default; }
      .modes { display: flex; gap: 6px; }
      .modes label { flex: 1; text-align: center; border: 1px solid #dadce0; border-radius: 8px; padding: 6px 4px; cursor: pointer; }
      .modes input { display: none; }
      .modes label.sel { background: #e8f0fe; border-color: #1967d2; color: #1967d2; font-weight: 500; }
      .modes label.sel.danger { background: #fce8e6; border-color: #c5221f; color: #c5221f; }
      .modehint { min-height: 16px; margin-top: 6px; font-size: 11.5px; color: #5f6368; }
      .row2 { display: flex; gap: 10px; }
      .row2 > div { flex: 1; }
      .check { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; }
      .check input { margin: 0; width: auto; }
      fieldset { border: 1px solid #dadce0; border-radius: 8px; padding: 10px 12px 12px; margin: 0 0 16px; }
      legend { font-weight: 500; padding: 0 4px; font-size: 12.5px; color: #5f6368; }
      #drop { border: 2px dashed #dadce0; border-radius: 10px; padding: 16px 12px; text-align: center; color: #5f6368; cursor: pointer; }
      #drop.over { border-color: #1a73e8; background: #e8f0fe; color: #1967d2; }
      #drop.loaded { border-style: solid; border-color: #188038; background: #e6f4ea; color: #188038; }
      #sendBtn { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 500; cursor: pointer; }
      #sendBtn:disabled { background: #dadce0; color: #80868b; cursor: default; }
      #sendBtn.danger { background: #c5221f; }
      #status { margin-top: 10px; min-height: 30px; font-size: 12px; white-space: pre-wrap; }
      #status.ok { color: #188038; }
      #status.err { color: #c5221f; }
      .bar { height: 8px; background: #f1f3f4; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; display: none; }
      .bar .fill { height: 100%; width: 0%; background: #1a73e8; border-radius: 4px; transition: width 0.4s; }
      .hidden { display: none; }
      #launcher { text-align: center; padding: 12px 4px; }
      #launcher p { color: #5f6368; }
      #launchBtn { padding: 10px 22px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>

    <script>
      var DATA = null;
      var ATTACHMENT = null; // { name, mimeType, dataB64, sizeLabel }
      var UI_MODE = <?!= JSON.stringify(uiMode) ?>;

      var AUD_META = {
        whole:    { label: "Whole list",       desc: "Every row of the Contact List (duplicates collapse by email)" },
        attended: { label: "Attended section", desc: "Rows between the top and the “RSVP 2+” marker" },
        rsvp:     { label: "RSVP 2+ section",  desc: "Rows between “RSVP 2+” and “Stop RSVP”" }
      };
      var MODE_HINT = {
        dry:    "Nothing is sent — recipients are logged to the Email Tracking sheet as Pending.",
        test:   "Emails go only to the test recipients listed below.",
        actual: "⚠ Sends REAL emails to everyone matched (skipping already-sent when enabled)."
      };

      try {
        boot(JSON.parse(<?!= JSON.stringify(bootData) ?>));
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<span style="color:#c5221f">Failed to load: ' + esc(e.message) + '</span>';
      }

      function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function $(id) { return document.getElementById(id); }

      function boot(data) {
        DATA = data;
        if (UI_MODE === 'dialog') { renderLauncher(); return; }
        renderForm();
      }

      // Popup iframes can't use google.script.run reliably under multi-login,
      // and this form needs it (upload + live progress) — so the popup is just
      // a launcher for the web-app tab pinned to the team account.
      function renderLauncher() {
        $('app').innerHTML =
          '<div id="launcher">' +
          '<h3>Bulk Emailer</h3>' +
          '<p>Composing and sending happens in a full tab, opened as<br><b>' + esc(DATA.sendAccount) + '</b> so sends come from the team account.</p>' +
          '<button id="launchBtn">Open Bulk Emailer</button>' +
          '<p class="hint">If the tab asks you to pick an account, choose the one above.</p>' +
          '</div>';
        $('launchBtn').addEventListener('click', function() {
          window.open(DATA.webappUrl + '?page=bulkemailer&authuser=' + encodeURIComponent(DATA.sendAccount), '_blank');
        });
      }

      function renderForm() {
        var audRadios = ['whole', 'attended', 'rsvp'].map(function(a, i) {
          var n = DATA.counts[a];
          var unavailable = (n == null);
          return '<label class="aud' + (unavailable ? ' disabled' : '') + '">' +
            '<input type="radio" name="aud" value="' + a + '"' + (i === 0 ? ' checked' : '') + (unavailable ? ' disabled' : '') + '>' +
            '<span><b>' + AUD_META[a].label + '</b><br><span class="desc">' + AUD_META[a].desc + '</span></span>' +
            '<span class="count' + (n === 0 ? ' zero' : '') + '">' +
            (unavailable ? 'markers missing' : n + (n === 1 ? ' email' : ' emails')) + '</span></label>';
        }).join('');

        var evOptions = '<option value="">(no event filter)</option>' + DATA.events.map(function(e) {
          return '<option value="' + esc(e.title) + '">' + esc(e.title) + ' — ' + esc(e.dateStr) + '</option>';
        }).join('');

        var modes = ['dry', 'test', 'actual'].map(function(m) {
          var sel = (m === 'test');
          return '<label id="mode-' + m + '" class="' + (sel ? 'sel' : '') + (m === 'actual' ? ' danger' : '') + '">' +
            '<input type="radio" name="mode" value="' + m + '"' + (sel ? ' checked' : '') + '>' +
            m.charAt(0).toUpperCase() + m.slice(1) + '</label>';
        }).join('');

        $('app').innerHTML =
          '<h3>Bulk Emailer</h3>' +
          '<p class="hint" style="margin-bottom:14px">Sends one email (batched, addresses hidden by default) to a slice of the Contact List. Tracked in the Email Tracking sheet by subject.</p>' +

          '<div class="section"><label class="block">Audience</label>' + audRadios + '</div>' +

          '<div class="section"><label class="block">Subject</label>' +
          '<input type="text" id="subject" value="' + esc(DATA.defaults.subject) + '"></div>' +

          '<div class="section"><label class="block">Body</label>' +
          '<textarea id="body" rows="10" placeholder="Type the email here…&#10;&#10;Blank lines become paragraph breaks. The text is placed in a clean, professional email layout — no formatting needed."></textarea>' +
          '<p class="hint">Whatever you type is safely escaped and wrapped in a simple serif card layout, so special characters and spacing come through exactly as written.</p></div>' +

          '<div class="section"><label class="block">Attachment (optional)</label>' +
          '<div id="drop">Drop a file here or click to browse</div>' +
          '<input type="file" id="file" class="hidden"></div>' +

          '<fieldset><legend>Filters</legend>' +
          '<label class="check"><input type="checkbox" id="filterRepeat"> Only rows marked “' + esc(DATA.defaults.repeatFlagValue) + '” (column E)</label>' +
          '<div class="row2" style="margin-top:8px"><div><label class="block">Only people in event</label><select id="eventFilter">' + evOptions + '</select></div></div>' +
          '<div class="row2" style="margin-top:8px">' +
          '<div><label class="block"># Attended more than</label><input type="number" id="moreThan" placeholder="(off)" min="0"></div>' +
          '<div><label class="block"># Attended less than</label><input type="number" id="lessThan" placeholder="(off)" min="0"></div>' +
          '</div>' +
          '<div style="margin-top:8px"><label class="block">Never send to</label>' +
          '<textarea id="exclude" rows="2" placeholder="comma or newline separated emails"></textarea></div>' +
          '</fieldset>' +

          '<fieldset><legend>Sending options</legend>' +
          '<label class="check"><input type="checkbox" id="skipSent" checked> Skip anyone already sent this subject (Email Tracking)</label>' +
          '<label class="check"><input type="checkbox" id="batchSingle" checked> Batch into one email per ~45 recipients (instead of one email each)</label>' +
          '<div class="row2" style="margin-top:8px">' +
          '<div><label class="block">Recipient visibility</label><select id="batchMode">' +
          '<option value="bcc"' + (DATA.defaults.batchMode === 'bcc' ? ' selected' : '') + '>BCC — addresses hidden</option>' +
          '<option value="to"' + (DATA.defaults.batchMode === 'to' ? ' selected' : '') + '>To — everyone visible</option></select></div>' +
          '<div><label class="block">Batch size (max 45–50)</label><input type="number" id="batchSize" value="' + DATA.defaults.batchSize + '" min="1" max="50"></div>' +
          '</div></fieldset>' +

          '<div class="section"><label class="block">Mode</label><div class="modes">' + modes + '</div>' +
          '<div class="modehint" id="modehint"></div>' +
          '<div id="testRow" style="margin-top:8px"><label class="block">Test recipients</label>' +
          '<input type="text" id="testRecipients" value="' + esc(DATA.defaults.testRecipients) + '"></div></div>' +

          '<button id="sendBtn">Send</button>' +
          '<div class="bar" id="bar"><div class="fill" id="fill"></div></div>' +
          '<div id="status"></div>';

        wireAttachment();
        Array.prototype.forEach.call(document.querySelectorAll('input[name=aud], input[name=mode]'), function(el) {
          el.addEventListener('change', refresh);
        });
        ['subject', 'body', 'testRecipients', 'batchSingle'].forEach(function(id) {
          $(id).addEventListener('input', refresh);
        });
        $('sendBtn').addEventListener('click', send);
        refresh();
      }

      function selected(name) {
        var el = document.querySelector('input[name=' + name + ']:checked');
        return el ? el.value : null;
      }

      function refresh() {
        var mode = selected('mode');
        ['dry', 'test', 'actual'].forEach(function(m) {
          $('mode-' + m).className = (m === mode ? 'sel' : '') + (m === 'actual' ? ' danger' : '');
        });
        $('modehint').textContent = MODE_HINT[mode] || '';
        $('testRow').style.display = (mode === 'test') ? '' : 'none';

        var subject = $('subject').value.trim();
        var body = $('body').value.trim();
        var aud = selected('aud');
        var n = (mode === 'test')
          ? $('testRecipients').value.split(/[,;\n]+/).filter(function(s) { return s.trim(); }).length
          : (DATA.counts[aud] || 0);

        var btn = $('sendBtn');
        btn.className = (mode === 'actual') ? 'danger' : '';
        btn.disabled = !subject || !body || n === 0;
        btn.textContent = !subject ? 'Enter a subject'
          : !body ? 'Write the email body'
          : n === 0 ? 'No recipients'
          : (mode === 'dry' ? 'Dry run for up to ' : mode === 'test' ? 'Send test to ' : 'Send to up to ') +
            n + (n === 1 ? ' person' : ' people');
      }

      // ------------------------------------------------------------------
      // Attachment upload (base64 through google.script.run)
      // ------------------------------------------------------------------
      function wireAttachment() {
        var drop = $('drop');
        var fileInput = $('file');
        drop.addEventListener('click', function() {
          if (ATTACHMENT) { clearAttachment(); return; }
          fileInput.click();
        });
        fileInput.addEventListener('change', function() {
          if (fileInput.files.length) loadFile(fileInput.files[0]);
        });
        ['dragenter', 'dragover'].forEach(function(ev) {
          drop.addEventListener(ev, function(e) { e.preventDefault(); drop.classList.add('over'); });
        });
        drop.addEventListener('dragleave', function() { drop.classList.remove('over'); });
        drop.addEventListener('drop', function(e) {
          e.preventDefault();
          drop.classList.remove('over');
          if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
      }

      function loadFile(file) {
        if (file.size > 20 * 1024 * 1024) {
          setStatus('err', '✗ Attachment is over 20 MB — email providers reject messages that large.');
          return;
        }
        var reader = new FileReader();
        reader.onload = function() {
          var b64 = String(reader.result).split(',')[1] || '';
          ATTACHMENT = {
            name: file.name,
            mimeType: file.type || 'application/octet-stream',
            dataB64: b64,
            sizeLabel: (file.size / 1024 / 1024).toFixed(1) + ' MB'
          };
          var drop = $('drop');
          drop.classList.add('loaded');
          drop.innerHTML = '<b>' + esc(file.name) + '</b> (' + ATTACHMENT.sizeLabel + ') — click to remove';
          setStatus('', '');
        };
        reader.onerror = function() { setStatus('err', '✗ Could not read that file.'); };
        reader.readAsDataURL(file);
      }

      function clearAttachment() {
        ATTACHMENT = null;
        var drop = $('drop');
        drop.classList.remove('loaded');
        drop.innerHTML = 'Drop a file here or click to browse';
        $('file').value = '';
      }

      // ------------------------------------------------------------------
      // Send (google.script.run — this page runs in the pinned web-app tab)
      // ------------------------------------------------------------------
      function send() {
        var mode = selected('mode');
        var aud = selected('aud');
        var payload = {
          mode: mode,
          audience: aud,
          subject: $('subject').value.trim(),
          bodyText: $('body').value,
          testRecipients: $('testRecipients').value,
          attachment: ATTACHMENT ? { name: ATTACHMENT.name, mimeType: ATTACHMENT.mimeType, dataB64: ATTACHMENT.dataB64 } : null,
          filterRepeat: $('filterRepeat').checked,
          eventTitle: $('eventFilter').value,
          attendedMoreThan: $('moreThan').value === '' ? null : Number($('moreThan').value),
          attendedLessThan: $('lessThan').value === '' ? null : Number($('lessThan').value),
          excludeEmails: $('exclude').value,
          skipAlreadySent: $('skipSent').checked,
          batchSingle: $('batchSingle').checked,
          batchMode: $('batchMode').value,
          batchSize: Number($('batchSize').value) || 45,
          progressToken: 'b' + Date.now() + Math.random().toString(36).slice(2)
        };

        if (mode === 'actual') {
          var n = DATA.counts[aud] || 0;
          if (!confirm('Send REAL emails to up to ' + n + ' people (' + AUD_META[aud].label + ') with subject "' + payload.subject + '"?')) return;
        }

        var btn = $('sendBtn');
        var status = $('status');
        btn.disabled = true;
        status.className = '';
        status.textContent = 'Starting — collecting recipients…';
        $('bar').style.display = 'block';
        $('fill').style.width = '0%';

        var poll = setInterval(function() {
          google.script.run
            .withSuccessHandler(function(p) {
              if (p && p.total) {
                $('fill').style.width = Math.min(100, Math.round(p.processed / p.total * 100)) + '%';
                var bits = [];
                if (p.sent) bits.push(p.sent + ' sent');
                if (p.planned) bits.push(p.planned + ' logged (dry)');
                if (p.skipped) bits.push(p.skipped + ' skipped');
                if (p.failed) bits.push(p.failed + ' failed');
                status.textContent = 'Processing ' + p.processed + ' of ' + p.total +
                  (bits.length ? ' — ' + bits.join(', ') : '');
              }
            })
            .withFailureHandler(function() {}) // polling is best-effort
            .getComposerSendProgress(payload.progressToken);
        }, 1500);

        google.script.run
          .withSuccessHandler(function(msg) {
            clearInterval(poll);
            $('fill').style.width = '100%';
            status.className = 'ok';
            status.textContent = '✓ ' + msg;
            refresh();
          })
          .withFailureHandler(function(e) {
            clearInterval(poll);
            $('bar').style.display = 'none';
            status.className = 'err';
            status.textContent = '✗ ' + e.message;
            refresh();
          })
          .sendBulkEmails(payload);
      }

      function setStatus(cls, msg) {
        var el = $('status');
        el.className = cls;
        el.textContent = msg;
      }
    </script>
  </body>
</html>
